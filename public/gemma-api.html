<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Gemma API Chat</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--line:#2a3243;--muted:#9aa6ba;--text:#edf2fb;--accent:#8b9cff;--green:#62d6a2;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#202a45 0,transparent 38%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{width:min(900px,calc(100% - 28px));margin:26px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:-1px}.sub,.hint{color:var(--muted);line-height:1.5}.sub{margin:6px 0 0}a{color:#b8c5ff;text-decoration:none}
.panel{background:#191e2aeb;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 14px 40px #0002}.status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin-bottom:12px}.dot{width:9px;height:9px;border-radius:50%;background:#788397}.dot.online{background:var(--green);box-shadow:0 0 12px #62d6a277}.dot.offline{background:var(--red)}
#chat{height:min(62vh,650px);min-height:300px;overflow:auto;background:#080b11;border:1px solid #30394c;border-radius:13px;padding:16px;display:flex;flex-direction:column;gap:13px}.message{max-width:90%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.user{align-self:flex-end;background:#293451;border:1px solid #3a4a70}.assistant{align-self:flex-start;background:#171e2b;border:1px solid #2b3549}.error{color:#ffaaaa;border-color:#713d48}
form{display:flex;gap:10px;margin-top:12px}textarea{flex:1;min-width:0;resize:vertical;min-height:54px;max-height:180px;background:#0b0e14;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:13px;font:14px/1.5 system-ui;outline:none}textarea:focus{border-color:var(--accent)}
button{font:inherit;background:#252d40;color:var(--text);border:1px solid #39445b;border-radius:10px;padding:10px 14px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:var(--accent);color:#10131b;border-color:var(--accent);font-weight:700}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hint{font-size:12px;margin:11px 0 0}.spacer{flex:1}
@media(max-width:560px){main{margin:16px auto}.panel{padding:12px}form{flex-direction:column}form button{align-self:flex-end}#chat{height:58vh}}
</style></head><body><main>
<header class="top"><div><h1>Gemma API Chat</h1><p class="sub">Chat with the Gemma model running on your Termux device.</p></div><a href="/">← Back to dashboard</a></header>
<section class="panel"><div class="status"><span id="dot" class="dot"></span><span id="status">Checking local Gemma API…</span><span class="spacer"></span><button id="refresh" type="button">Check status</button></div>
<div id="chat" aria-live="polite"><div class="message assistant">Hello! Send a message to your local Gemma API.</div></div>
<form id="form"><textarea id="prompt" rows="2" placeholder="Message Gemma… (Enter to send, Shift+Enter for a new line)"></textarea><button id="send" class="primary" type="submit">Send</button></form>
<div class="actions" style="margin-top:10px"><button id="clear" type="button">Clear chat</button><span class="hint">Streaming response · API port 23456 · Requests stay on your local network</span></div></section></main><script src="/gemma-api.js"></script></body></html>
